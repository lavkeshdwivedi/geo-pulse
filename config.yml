# GeoPulse Configuration
# All values can be overridden via environment variables.

# Cron schedule for the GitHub Actions workflow (default: every hour)
update_schedule: "0 * * * *"


# ---------------------------------------------------------------------------
# Editor's note — a one-off announcement card rendered under the hero, above
# the story feed. Leave the body empty to hide the card. Both languages must
# be set if you want the card to appear in both editions.
# ---------------------------------------------------------------------------
editor_note:
  title: "Android beta is live"
  title_hi: "Android बीटा शुरू हो गया"
  body: "I just shipped the first GeoPulse Android beta to Google Play, with the same hourly news you read here, plus push notifications when a new edition lands. I need a dozen testers to clear Google's two-week beta gate before the app can go public. If you have an Android phone and thirty seconds to spare, drop me a line and I'll add you to the list."
  body_hi: "GeoPulse का पहला Android बीटा अभी Google Play पर भेजा है। यहाँ जो खबरें पढ़ते हैं वही ऐप में मिलेंगी, साथ में नई एडिशन आने पर पुश नोटिफिकेशन। ऐप को सार्वजनिक करने से पहले Google की दो-हफ्ते की बीटा शर्त के लिए मुझे एक दर्जन टेस्टर चाहिए। अगर आपके पास Android फ़ोन है, तो मेल कर दीजिए, मैं जोड़ दूँगा।"
  cta_label: "Email me to join"
  cta_label_hi: "जुड़ने के लिए मेल करें"
  cta_href: "mailto:shiveshsolutions@gmail.com?subject=GeoPulse%20Android%20tester&body=Hi%20Lav%2C%20please%20add%20my%20Gmail%20to%20the%20GeoPulse%20Android%20closed%20beta.%20My%20address%20is%3A%20"


# ---------------------------------------------------------------------------
# Brand & ownership — the bits a forker almost certainly wants to change.
# These values are swapped into generated HTML, RSS metadata, and outbound
# HTTP headers. Edit these once and the whole site rebrands.
# ---------------------------------------------------------------------------
brand:
  # Editor / owner displayed in the header eyebrow, about block, and feed.xml.
  editor_name: "Lavkesh Dwivedi"
  editor_name_hi: "लवकेश द्विवेदी"
  editor_website: "https://lavkesh.com"

  # Public identity
  site_title: "GeoPulse"
  site_url: "https://pulse.lavkesh.com"

  # Where the header language toggle points, relative to site_url.
  # Set to "/" if you only run one language; default "/hi" sends to Hindi.
  language_switch_path: "/hi"

  # HTTP User-Agent sent on RSS fetches, article scraping, and stock image
  # search. Publishers do read this. Keep a reachable contact URL inside it.
  # Falls back to "GeoPulseTemplate/1.0" if this key is missing entirely.
  user_agent: "GeoPulseByLavkesh/1.0 (+https://pulse.lavkesh.com)"

  # Custom domain for GitHub Pages. Leave empty ("") to serve at the default
  # <user>.github.io/<repo>/ URL. When set, generate_site.py writes this
  # value to site/CNAME on every build. When empty, it removes any stale
  # site/CNAME so a fork never inherits the original owner's domain.
  custom_domain: "pulse.lavkesh.com"

  # Social links rendered in the footer. Set any value to an empty string to
  # hide that link from the rendered footer.
  social:
    linkedin: "https://linkedin.com/in/lavkesh"
    x: "https://x.com/lavkeshdwivedi"
    github: "https://github.com/lavkeshdwivedi"
    instagram: "https://instagram.com/lavkeshdwivedi"
    facebook: "https://facebook.com/lavkesh"
    topmate: "https://topmate.io/lavkesh"

# News sources to use. Options: "newsapi", "gdelt", "rss"
# gdelt and rss require no API key.
news_sources:
  - rss

# Additional NewsAPI source (requires NEWSAPI_KEY secret)
# Uncomment the line below to enable:
# - newsapi

# Keywords used to filter/query geopolitics news (English, used by GDELT and NewsAPI)
news_query: "geopolitics OR diplomacy OR sanctions OR conflict OR NATO OR United Nations OR international relations"

# Translation backend for Hindi edition.
# Default: MyMemory API (free, no key, commercial use permitted, 1000 req/day).
# Optional: set DEEPL_API_KEY secret for higher quality (DeepL Free = 500k chars/month).
#   Free-tier DeepL keys end with ':fx' — get one at deepl.com/en/pro#developer.
# Do NOT use deep-translator's GoogleTranslator — it scrapes google.com and violates ToS.

# LLM provider for summarization. Free tier only.
# Chain tries best-quality provider first and falls back automatically.
# Options:
#   gemini      — FREE. Gemini 2.5 Flash via Google AI Studio. Needs GEMINI_API_KEY.
#                 Get a free key at aistudio.google.com. 1,500 req/day, 1M tok/day.
#   groq        — FREE. Llama 3.3 70B via Groq. Needs GROQ_API_KEY secret.
#                 Get a free key at console.groq.com. 14,400 req/day, 500k tok/day.
#   none        — No AI. Falls back to RSS description truncation.
llm_provider: "gemini"

# Primary LLM model (informational — actual model pool is managed in llm_client.py,
# best quality model is tried first and falls back through the pool on rate limits).
# gemini best free: gemini-2.5-flash (best), gemini-2.5-flash-lite, gemini-2.0-flash
# groq best free:   llama-3.3-70b-versatile (best), llama-3.1-8b-instant (fast fallback)
llm_model: "gemini-2.5-flash"

# Maximum number of stories published per language per run. 25 gives us one
# featured lead plus a 24-card grid, which lines up cleanly on common column
# counts (2, 3, 4, 6, 8) so the last row never looks lopsided. Per-edition
# cap is also enforced in generate_site.py.
max_articles: 25

